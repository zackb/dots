blur = on
# Border and window
border_width            = 2
border_active           = 0x16b8f3cc
border_inactive         = 0x44444488
border_gradient         = 0xff2090ff

animation        = 150

shadow           = on
shadow_color     = 0x00000055
shadow_blur      = 28

gaps             = 2
margin           = 0 0 0 0
rounding         = 6
opacity          = 0.95
scale            = auto
sensitivity      = 0.55
tap_to_click     = false

# Cursor
cursor          = BreezeX-RosePine-Linux
cursor_size     = 24

# ENV
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Binds
bind = SUPER, R, exec, ghostty
bind = SUPER,       Q,      killactive
bind = SUPER SHIFT, Q,      exit
bind = SUPER,       H,      focusleft
bind = SUPER,       L,      focusright
bind = SUPER,       K,      focusup
bind = SUPER,       J,      focusdown
bind = SUPER,       F,      fullscreen
bind = SUPER,       V,      togglefloating
bind = SUPER,       P,      pin
bind = SUPER,       T,      togglesplit

# Fenriz quickshell
bind = SUPER, Space,        exec, fenriz-desktop launcher
bind = SUPER SHIFT, L,      exec, fenriz-desktop lock
bind = SUPER, W,            exec, fenriz-desktop wallpaper
bind = SUPER, Tab,          exec, hyprwat --overview
# bind = SUPER, Space,        exec, qs ipc call launcher toggle
# bind = SUPER SHIFT, L,      exec, qs ipc call lock lock
#bind = SUPER, W,            exec, ~/bin/wallpaper.sh

# Workspaces
bind = SUPER,       1, workspace, 1
bind = SUPER,       2, workspace, 2
bind = SUPER,       3, workspace, 3
bind = SUPER,       4, workspace, 4
bind = SUPER,       5, workspace, 5
bind = SUPER,       6, workspace, 6
bind = SUPER,       7, workspace, 7
bind = SUPER,       8, workspace, 8
bind = SUPER,       9, workspace, 9
bind = SUPER,       0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Apps / shell
bind = SUPER,       E,      exec, ghostty -e yazi
bind = SUPER,       Return, exec, qs ipc call shell toggle
bind = SUPER SHIFT, W,      exec, qs ipc call shell reload
bind = SUPER SHIFT, V,      exec, qs ipc call launcher clipboard

# Screenshots
bind = ,      Print, exec, grim -g "$(slurp)" - | satty -f - -o ~/Pictures/screenshot-%Y%m%d-%H%M%S.png --early-exit save
bind = SUPER, Print, exec, grim -g "$(slurp)" - | satty -f - --copy-command wl-copy --actions-on-enter save-to-clipboard --early-exit copy

# Media / brightness
binde = , XF86AudioRaiseVolume,  exec, fenriz-desktop volume +5 # exec, qs ipc call osd volumeUp
binde = , XF86AudioLowerVolume,  exec, fenriz-desktop volume -5 # qs ipc call osd volumeDown
bind  = , XF86AudioMute,         exec, fenriz-desktop volume mute # qs ipc call osd mute
bind  = , XF86AudioMicMute,      exec, fenriz-desktop volume micmute 

binde = , XF86MonBrightnessUp,   exec, fenriz-desktop brightness +5 # qs ipc call osd brightnessUp
binde = , XF86MonBrightnessDown, exec, fenriz-desktop brightness -5 # qs ipc call osd brightnessDown

bind = , XF86AudioNext,  exec, playerctl next
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioPlay,  exec, playerctl play-pause
bind = , XF86AudioPrev,  exec, playerctl previous
bind = , XF86PowerOff,   exec, qs ipc call controlcenter toggle

# Screen zoom / magnifier
zoom_mod         = ctrl
zoom_max         = 10.0
zoom_step        = 0.1

# Window rules
windowrule = name=pavucontrol, class=^(org\.pulseaudio\.pavucontrol)$, float=true, center=true
windowrule = name=satty,       class=^com\.gabm\.satty$,               float=true, center=true
windowrule = name=filechooser, class=^xdg-desktop-portal-gtk$,         float=true, center=true

# Exec
exec-once = fenriz-desktop
exec-once = quickshell
